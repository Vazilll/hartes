[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vazus-core"
version = "5.0.0"
description = "Vazus SuperGraph OS Core Engine & Formal Verification Substrate"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Vaz", email = "peek2mz@gmail.com" }
]
dependencies = [
    "PyYAML>=6.0.3",
    "av>=18.0.0",
    "beautifulsoup4>=4.14.3",
    "bleak>=3.0.2",
    "capstone>=5.0.9",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "fastmcp>=3.4.7",
    "google-ai-generativelanguage>=0.6.15",
    "google-antigravity>=0.1.10",
    "google-api-core>=2.34.0",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.3",
    "google-auth-oauthlib>=1.4.0",
    "google-cloud-aiplatform>=1.163.0",
    "google-cloud-bigquery>=3.43.0",
    "google-cloud-core>=2.6.1",
    "google-cloud-resource-manager>=1.18.0",
    "google-cloud-storage>=3.13.1",
    "google-cloud-vectorsearch>=0.11.1",
    "google-genai>=2.17.0",
    "google-generativeai>=0.8.6",
    "google-resumable-media>=2.10.1",
    "googleapis-common-protos>=1.75.0",
    "grpc-google-iam-v1>=0.14.5",
    "grpcio>=1.83.0",
    "httpx>=0.28.1",
    "hypothesis>=6.165.5",
    "langgraph>=1.2.10",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-prebuilt>=1.1.0",
    "mcp>=1.29.0",
    "nest-asyncio>=1.6.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.10.0",
    "openvino>=2024.4.0",
    "optimum>=2.1.0",
    "orjson>=3.11.9",
    "pillow>=12.3.0",
    "pix2text>=1.1.6",
    "playwright>=1.62.0",
    "protobuf>=7.35.1",
    "psutil>=7.2.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "pywin32>=312; sys_platform == 'win32'",
    "rapidocr>=3.9.2",
    "reportlab>=5.0.0",
    "requests>=2.34.2",
    "rzpipe>=0.6.2",
    "sqlite-vec>=0.1.9",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "urllib3>=2.7.0",
    "uvicorn>=0.52.1",
    "watchdog>=6.0.0",
    "watchfiles>=1.2.0",
    "websockets>=15.0.1",
    "z3-solver>=4.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "vulture>=2.11",
    "pyright>=1.1.380",
    "ruff>=0.16",
    "deptry>=0.25",
    "pip-audit>=2.10",
    "bandit>=1.9"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vazus_core*", "services*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "labs",
    "services/inference",
    "scratch",
    "bin",
    "apps",
    "knowledge",
    "data",
    "node_modules",
    ".venv",
    "pyenv",
    "worktrees",
]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.deptry]
exclude = [
    "labs",
    "services/inference",
    "scratch",
    "bin",
    "apps",
    "knowledge",
    "data",
    ".venv",
    "pyenv",
    "worktrees",
]
known_first_party = [
    "vazus_core",
    "services",
    "scripts",
    "harness",
    "colab_mcp",
    "vazus_embedder",
    "rlm",
    "labs",
    "sync_dialogues",
    "export_brain_state",
    "orchestrator_pb2",
    "orchestrator_pb2_grpc",
    "health_telemetry_pb2",
    "health_telemetry_pb2_grpc",
    "google_fit_sync",
    "resilient_downloader",
    "raytsystem",
    "open_deep_research",
    "ble_mi_scale_scanner",
    "langgraph_health_workflow",
    "rlm_unified_worker",
    "provision_binary_tools",
]

[tool.deptry.per_rule_ignores]
DEP001 = ["telethon", "langfuse", "sentence_transformers", "mem0", "plotext", "gtts", "pyttsx3"]
DEP002 = ["pytest-asyncio", "vulture", "pyright", "ruff", "deptry", "pip-audit", "bandit"]
DEP003 = ["labs", "open_deep_research", "win32con", "keystone"]
