syntax = "proto3";

package vazus.health;

service HealthTelemetryService {
    rpc SyncGoogleFitData (GoogleFitSyncRequest) returns (GoogleFitSyncResponse);
    rpc StreamHealthMetrics (stream HealthMetricBatch) returns (HealthTelemetrySummary);
    rpc GetReadinessAssessment (ReadinessRequest) returns (ReadinessResponse);
}

message GoogleFitSyncRequest {
    int32 days_back = 1;
    bool force_refresh = 2;
    string client_id = 3;
}

message GoogleFitSyncResponse {
    bool success = 1;
    string message = 2;
    int32 total_steps = 3;
    float total_calories = 4;
    int32 active_minutes = 5;
    int32 sleep_sessions_count = 6;
    int32 workout_sessions_count = 7;
    float readiness_score = 8;
    string timestamp = 9;
}

message HealthMetricBatch {
    string metric_type = 1;
    double value = 2;
    int64 timestamp_ms = 3;
    map<string, string> metadata = 4;
}

message HealthTelemetrySummary {
    int32 metrics_processed = 1;
    string status = 2;
    int64 last_processed_timestamp_ms = 3;
}

message ReadinessRequest {
    string user_id = 1;
    string date = 2;
}

message ReadinessResponse {
    string date = 1;
    float readiness_score = 2;
    float sleep_recovery_score = 3;
    float physical_activity_score = 4;
    float hrv_stress_score = 5;
    string recommendation = 6;
}
