name: "Deploy Gemini Bridge → Cloud Run"

# Triggers:
# 1. Auto: push to main/vazus-dev that changes services/gemini_bridge/
# 2. Manual: workflow_dispatch (from GitHub UI or phone)
on:
  push:
    branches: [main, vazus-dev]
    paths:
      - "services/gemini_bridge/**"
      - ".github/workflows/deploy_cloudrun.yml"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force re-deploy even without code changes"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  id-token: write   # Needed for Workload Identity Federation (keyless GCP auth)

env:
  PROJECT_ID: vazus-supergraph-prod
  REGION: us-central1
  SERVICE_NAME: gemini-bridge
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: us-central1-docker.pkg.dev/vazus-supergraph-prod/gemini-bridge/server

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Validate & Test before deploy
  # ─────────────────────────────────────────────
  validate:
    name: "Validate & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gemini_bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MCP endpoint tests (headless)
        run: |
          # Run all test suites that don't require live Cloud Run
          python -m pytest tests/test_academic_tools.py \
                           tests/test_cloudrun_endpoints.py \
                           -v --tb=short -q 2>&1 | tail -30
        continue-on-error: false

      - name: Lint Dockerfile syntax
        run: |
          docker build --dry-run . 2>/dev/null || \
          python -c "
          content = open('Dockerfile').read()
          assert 'run_cloudrun.py' in content, 'Dockerfile must launch run_cloudrun.py'
          assert 'EXPOSE 8080' in content, 'Dockerfile must EXPOSE 8080'
          print('Dockerfile OK')
          "

  # ─────────────────────────────────────────────
  # Job 2: Build & Push Docker image to Artifact Registry
  # ─────────────────────────────────────────────
  build-and-push:
    name: "Build & Push Image"
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build & Push (short SHA tag + latest)
        id: build
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE_TAG="${{ env.IMAGE }}:${SHORT_SHA}"
          IMAGE_LATEST="${{ env.IMAGE }}:latest"

          docker build \
            --tag "$IMAGE_TAG" \
            --tag "$IMAGE_LATEST" \
            --label "git_sha=${GITHUB_SHA}" \
            --label "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            services/gemini_bridge/

          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

          echo "image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_full=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────
  # Job 3: Deploy to Cloud Run
  # ─────────────────────────────────────────────
  deploy:
    name: "Deploy to Cloud Run"
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:latest
          flags: >-
            --allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=1
            --concurrency=80
            --timeout=300
            --port=8080
            --set-env-vars=PYTHONUNBUFFERED=1,HOST=0.0.0.0
          no_traffic: false

      - name: Verify deployment health
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          echo "Deployed to: $SERVICE_URL"

          # Wait for container to boot (cold start)
          sleep 10

          # Health check
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}/health")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check FAILED: HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Health check PASSED: HTTP $HTTP_STATUS"

          # MCP discovery check
          DISCO=$(curl -s "${SERVICE_URL}/.well-known/mcp")
          echo "MCP Discovery: $DISCO"
          echo "$DISCO" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'endpoint' in d"
          echo "MCP Discovery OK"

      - name: Write Service URL to repo (for Apps Script)
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          echo "$SERVICE_URL" > services/gemini_bridge/CLOUD_RUN_URL.txt
          cat services/gemini_bridge/CLOUD_RUN_URL.txt

      - name: Commit Service URL
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(cloudrun): update CLOUD_RUN_URL.txt [skip ci]"
          file_pattern: services/gemini_bridge/CLOUD_RUN_URL.txt

      - name: Summary
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | \`${{ env.SERVICE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | \`${{ env.REGION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| MCP Endpoint | [\`${SERVICE_URL}/mcp\`](${SERVICE_URL}/mcp) |" >> $GITHUB_STEP_SUMMARY
          echo "| Health | [\`${SERVICE_URL}/health\`](${SERVICE_URL}/health) |" >> $GITHUB_STEP_SUMMARY
          echo "| Discovery | [\`${SERVICE_URL}/.well-known/mcp\`](${SERVICE_URL}/.well-known/mcp) |" >> $GITHUB_STEP_SUMMARY
          echo "| Git SHA | \`${GITHUB_SHA::8}\` |" >> $GITHUB_STEP_SUMMARY
