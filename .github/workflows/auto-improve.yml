name: Auto-Improve Cycle

on:
  schedule:
    # Every 6 hours, matching AutoImproverDaemon.DEFAULT_INTERVAL_HOURS
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force improvement cycle even if not due'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: auto-improve
  cancel-in-progress: false

env:
  VAZUS_CI: "1"
  PYTHONIOENCODING: "utf-8"

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-improve:
    name: Recursive Self-Improvement
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vazus-dev
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio PyYAML httpx orjson psutil \
                      numpy z3-solver python-dotenv nest-asyncio \
                      hypothesis sqlite-vec ruff 2>/dev/null || true
          pip install -e ".[dev]" --no-deps 2>/dev/null || true

      - name: Create CI DB
        run: |
          python -c "
          import sqlite3, os
          os.makedirs('services/memory', exist_ok=True)
          conn = sqlite3.connect('services/memory/vazus.db')
          conn.execute('PRAGMA journal_mode=WAL')
          conn.commit()
          conn.close()
          "

      - name: Run auto-improvement analysis
        id: improve
        run: |
          python -c "
          import sys, json
          sys.path.insert(0, '.')
          os.environ['VAZUS_DB_PATH'] = 'services/memory/vazus.db'

          from vazus_core.workers.auto_improver_daemon import AutoImproverDaemon
          import os

          daemon = AutoImproverDaemon(db_path='services/memory/vazus.db')
          force = '${{ inputs.force_run }}' == 'true'

          if force or daemon.should_run():
              result = daemon.run_cycle(force=True)
              print(json.dumps(result, indent=2, default=str))
              with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
                  f.write(f'improved=true\n')
                  f.write(f'session_id={result[\"session_id\"]}\n')
          else:
              status = daemon.get_status()
              print(f'Skipping: last run {status[\"hours_since_last\"]}h ago')
              with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
                  f.write('improved=false\n')
          " 2>&1

      - name: Run ruff auto-fix
        if: steps.improve.outputs.improved == 'true'
        run: |
          ruff check --fix --select E9,F,I vazus_core/ 2>/dev/null || true
          ruff format vazus_core/ 2>/dev/null || true

      - name: Run tests after improvement
        if: steps.improve.outputs.improved == 'true'
        run: |
          python -m pytest tests/ \
            -x -q --tb=short \
            -k "not npu and not openvino and not wsb and not sandbox and not silicon and not hardware and not gemma" \
            --ignore=tests/future_specs \
            --timeout=60 || true

      - name: Check for changes
        if: steps.improve.outputs.improved == 'true'
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            git diff --stat
          fi

      - name: Create auto-improvement PR
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          BRANCH="auto-improve/$(date +%Y%m%d-%H%M%S)"
          git config user.name "Vazus AutoImprover"
          git config user.email "vazus-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "feat(auto-improve): J-Space reweighting + code quality fixes

          Session: ${{ steps.improve.outputs.session_id }}
          Triggered by: ${{ github.event_name }}

          Automated by AutoImproverDaemon recursive self-improvement cycle."

          git push origin "$BRANCH"

          # Create PR via GitHub API
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls" \
            -d "{
              \"title\": \"🔄 Auto-Improve: ${{ steps.improve.outputs.session_id }}\",
              \"body\": \"## Automated Self-Improvement PR\\n\\nGenerated by \`AutoImproverDaemon.run_cycle()\`\\n\\n- J-Space adaptive tool re-weighting\\n- Ruff auto-fix applied\\n- Tests passed after improvement\\n\\nSession ID: \`${{ steps.improve.outputs.session_id }}\`\",
              \"head\": \"$BRANCH\",
              \"base\": \"vazus-dev\"
            }"
