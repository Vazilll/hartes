services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-changeme}
    volumes:
      - searxng-data:/etc/searxng
    networks:
      - dnts-isolated

networks:
  dnts-isolated:
    driver: bridge
    name: dnts-isolated

volumes:
  searxng-data:
