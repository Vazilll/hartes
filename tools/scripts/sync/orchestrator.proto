syntax = "proto3";

package orchestrator;

service AgentDispatcher {
    // Dispatches an RLM agent asynchronously.
    rpc DispatchRLM (RLMRequest) returns (RLMResponse) {}
}

message RLMRequest {
    string prompt = 1;
    string complexity = 2;
    int32 max_iterations = 3;
    int32 max_depth = 4;
}

message RLMResponse {
    string task_id = 1;
    string status = 2;
    string result = 3;
}
