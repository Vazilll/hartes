<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vazus SuperGraph Health OS | Mi Band & Scale Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0B0F17;
            --bg-card: #131B2A;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00F2FE;
            --accent-blue: #4FACFE;
            --accent-purple: #7F00FF;
            --accent-green: #10B981;
            --accent-yellow: #F59E0B;
            --accent-red: #EF4444;
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --font-main: 'Outfit', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); color: var(--text-primary); font-family: var(--font-main); padding: 15px; }

        header {
            display: flex; justify-content: space-between; align-items: center; padding: 16px 20px;
            background: rgba(19, 27, 42, 0.7); backdrop-filter: blur(16px);
            border: 1px solid var(--border-color); border-radius: 16px; margin-bottom: 20px;
        }

        .brand h1 { font-size: 18px; font-weight: 700; background: linear-gradient(90deg, #FFFFFF, var(--accent-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand p { font-size: 11px; color: var(--text-secondary); }

        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 18px; margin-bottom: 20px; }
        .card-title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 15px; }

        .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .metric-box { background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; text-align: center; }
        .metric-val { font-size: 20px; font-weight: 700; }
        .metric-lbl { font-size: 11px; color: var(--text-secondary); }

        .chart-container { position: relative; height: 260px; width: 100%; }

        .btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #000; font-weight: 600; padding: 12px 16px; border: none; border-radius: 12px; width: 100%;
            cursor: pointer; font-size: 14px; margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>vazus Health OS (Pixel 10)</h1>
            <p>Google Health Connect • Zepp Mi Band • Mi Scale</p>
        </div>
    </header>

    <div class="card">
        <div class="card-title">📈 Нагрузка PMC (CTL / ATL / TSB)</div>
        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-lbl">CTL (Фитнес)</div>
                <div class="metric-val" style="color: var(--accent-cyan);">54.2</div>
            </div>
            <div class="metric-box">
                <div class="metric-lbl">ATL (Усталость)</div>
                <div class="metric-val" style="color: var(--accent-purple);">42.8</div>
            </div>
            <div class="metric-box">
                <div class="metric-lbl">TSB (Форма)</div>
                <div class="metric-val" style="color: var(--accent-green);">+11.4</div>
            </div>
            <div class="metric-box">
                <div class="metric-lbl">TRIMP Сегодня</div>
                <div class="metric-val" style="color: var(--accent-yellow);">95.0</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="pmcChart"></canvas>
        </div>
    </div>

    <div class="card">
        <div class="card-title">⚖️ Состав Тела (Mi Scale 2 BLE)</div>
        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-lbl">Вес</div>
                <div class="metric-val" style="color: #60A5FA;">74.5 кг</div>
            </div>
            <div class="metric-box">
                <div class="metric-lbl">% Жира</div>
                <div class="metric-val" style="color: #F472B6;">15.2%</div>
            </div>
            <div class="metric-box">
                <div class="metric-lbl">Мышцы</div>
                <div class="metric-val" style="color: #34D399;">59.8 кг</div>
            </div>
            <div class="metric-box">
                <div class="metric-lbl">Вода</div>
                <div class="metric-val" style="color: #38BDF8;">61.4%</div>
            </div>
        </div>

        <button class="btn" onclick="triggerNativeScan()">Синхронизировать с Mi Scale (BLE)</button>
    </div>

    <script>
        let labels = ['1 Июл', '5 Июл', '10 Июл', '15 Июл', '20 Июл', '25 Июл', '30 Июл'];
        let ctls = [42, 45, 48, 50, 52, 53, 54.2];
        let atls = [35, 40, 55, 48, 52, 44, 42.8];
        let tsbs = [7, 5, -7, 2, 0, 9, 11.4];

        let ctx = document.getElementById('pmcChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: 'CTL (Фитнес)', data: ctls, borderColor: '#00F2FE', borderWidth: 2.5, tension: 0.3 },
                    { label: 'ATL (Усталость)', data: atls, borderColor: '#7F00FF', borderWidth: 2, tension: 0.3 },
                    { label: 'TSB (Форма)', data: tsbs, borderColor: '#10B981', borderDash: [4, 4], borderWidth: 2, tension: 0.3 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { ticks: { color: '#9CA3AF' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                    y: { ticks: { color: '#9CA3AF' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                },
                plugins: { legend: { labels: { color: '#F3F4F6' } } }
            }
        });

        function triggerNativeScan() {
            if (window.AndroidNative && window.AndroidNative.startMiScaleBleScan) {
                let res = window.AndroidNative.startMiScaleBleScan();
                if (window.AndroidNative.showToast) {
                    window.AndroidNative.showToast("Данные Mi Scale синхронизированы по BLE!");
                }
            } else {
                alert("Синхронизация по BLE 5.0 выполнена!");
            }
        }
    </script>
</body>
</html>
